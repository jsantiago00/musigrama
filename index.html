<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Musigrama</title>

<!-- PWA: permite "instalar" la app en el celular (ícono + pantalla completa) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Musigrama">
<style>
  :root{
    --paper: #fdfcf7;
    --ink: #2c2c2c;
    --ui-bg: rgba(255,255,255,0.85);
    --ui-border: rgba(0,0,0,0.08);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overscroll-behavior: none;
    background-color: var(--paper); /* respaldo antes del primer frame; la grilla se dibuja en el canvas */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  #canvas{
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    touch-action: none; /* evita scroll/zoom del navegador al dibujar */
    cursor: crosshair;
  }
  #canvas.erasing{ cursor: cell; }
  .hint{
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 20px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    font-size: 13px; color: #666; pointer-events: none;
    transition: opacity 0.6s ease;
    backdrop-filter: blur(4px);
  }
  .hint.hidden{ opacity: 0; }

  /* Ícono flotante: abre/cierra la toolbar para no ocupar pantalla de
     entrada, sobre todo en el celular. */
  .fab{
    position: fixed; right: 18px; bottom: 18px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    width: 50px; height: 50px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    backdrop-filter: blur(6px);
    color: var(--ink);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .fab svg{ width: 22px; height: 22px; }
  .fab.hidden{ opacity: 0; transform: scale(0.7); pointer-events: none; }

  .toolbar{
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px;
    padding: 10px 14px; border-radius: 28px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    backdrop-filter: blur(6px);
    max-width: min(94vw, 640px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .toolbar.open{
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .btn{
    display:flex; align-items:center; justify-content:center;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; background: transparent; cursor: pointer;
    color: var(--ink); transition: background 0.15s ease;
  }
  .btn:hover{ background: rgba(0,0,0,0.06); }
  .btn:active{ background: rgba(0,0,0,0.12); }
  .btn.active{ background: rgba(220,38,38,0.14); color: #b91c1c; }
  .btn svg{ width: 20px; height: 20px; }

  .btn-labeled{
    width: auto; border-radius: 20px; padding: 0 14px 0 10px; gap: 6px;
    font-size: 13px; font-weight: 500;
  }
  .btn-labeled svg{ width: 14px; height: 14px; }

  .btn.recording{ background: rgba(220,38,38,0.16); color: #b91c1c; animation: recPulse 1.2s ease-in-out infinite; }
  @keyframes recPulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(220,38,38,0.35); }
    50%{ box-shadow: 0 0 0 6px rgba(220,38,38,0); }
  }

  .rec-indicator{
    position: fixed; top: 18px; right: 18px; z-index: 2;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 20px;
    background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.28);
    color: #b91c1c; font-size: 12px; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(4px);
  }
  .rec-indicator[hidden]{ display: none; }
  .rec-dot{ width: 8px; height: 8px; border-radius: 50%; background: #dc2626; animation: recBlink 1.2s ease-in-out infinite; }
  @keyframes recBlink{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.25; } }

  /* Panel que aparece cuando la grabación queda lista: el toque en
     "Compartir" tiene que ser un gesto del usuario fresco (no disparado
     desde un callback async) para que Android permita abrir el share. */
  .rec-result{
    position: fixed; top: 18px; right: 18px; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 20px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    backdrop-filter: blur(6px);
    font-size: 13px;
  }
  .rec-result[hidden]{ display: none; }
  .rec-result button{
    border: none; border-radius: 14px; padding: 6px 12px;
    font-size: 13px; cursor: pointer;
  }
  .rec-result .share-btn{ background: #7c3aed; color: #fff; }
  .rec-result .dl-btn{ background: rgba(0,0,0,0.06); color: var(--ink); }
  .rec-result .close-btn{ background: transparent; color: #999; padding: 4px 6px; font-size: 15px; }
  .rec-result span{ max-width: 44vw; }

  .control-wrap{
    display:flex; align-items:center; gap:8px;
    padding: 0 6px; border-left: 1px solid var(--ui-border);
  }
  .control-wrap label{ font-size: 12px; color:#777; white-space:nowrap; }
  .control-wrap input[type=range]{
    width: 80px; accent-color: #7c3aed; cursor: pointer;
  }

  /* Selector de color/timbre: todas las opciones a la vista, una al
     lado de la otra (nada de popover ni ciclar) — tocás directo la que
     querés. La primera es "automático" (arcoíris, rota solo). */
  .color-row{
    display: flex; align-items: center; gap: 6px;
    padding: 0 6px; border-left: 1px solid var(--ui-border);
  }
  .swatch{
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2px solid transparent; padding: 0; cursor: pointer;
  }
  .swatch.selected{ border-color: #141414; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hint" id="hint">Dibujá un trazo libre: al cruzar la línea central, sonará ✏️🎵</div>

<div class="rec-indicator" id="recIndicator" hidden>
  <span class="rec-dot"></span>
  <span id="recTime">00:00</span>
</div>

<div class="rec-result" id="recResult" hidden>
  <span id="recResultText">Grabación lista</span>
  <button class="share-btn" id="shareRecBtn">Compartir</button>
  <button class="dl-btn" id="downloadRecBtn">Descargar</button>
  <button class="close-btn" id="dismissRecBtn" aria-label="Cerrar">✕</button>
</div>

<button class="fab" id="fabBtn" title="Abrir herramientas" aria-label="Abrir herramientas">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="6" x2="20" y2="6"></line>
    <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
    <line x1="4" y1="18" x2="20" y2="18"></line>
    <circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
  </svg>
</button>

<div class="toolbar" id="toolbar">
  <button class="btn active" id="pencilBtn" title="Lápiz: dibujar trazos libres" aria-label="Herramienta lápiz">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
    </svg>
  </button>

  <button class="btn" id="pixelBtn" title="Pixel art: pintar celdas de la grilla" aria-label="Herramienta pixel art">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor" stroke="none"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor" stroke="none"></rect>
    </svg>
  </button>

  <div class="color-row" id="colorRow"></div>

  <button class="btn" id="eraserBtn" title="Goma: borra la parte del trazo que toques" aria-label="Herramienta goma">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20H8.5L3.6 15.1a2 2 0 0 1 0-2.8l7-7a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"></path>
      <path d="M6 15l6 6"></path>
    </svg>
  </button>

  <button class="btn" id="clearBtn" title="Limpiar todo" aria-label="Limpiar todo el canvas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      <path d="M10 11v6"></path><path d="M14 11v6"></path>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
    </svg>
  </button>

  <button class="btn btn-labeled" id="recordBtn" title="Grabar esta sesión (video + audio) y compartirla" aria-label="Grabar sesión">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7" fill="currentColor" stroke="none"></circle>
    </svg>
    <span>Grabar</span>
  </button>

  <button class="btn" id="muteBtn" title="Silenciar / activar sonido" aria-label="Silenciar / activar sonido">
    <svg id="iconSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4 9 9 9 13 5 13 19 9 15 4 15 4 9"></polygon>
      <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
      <path d="M19 6a9 9 0 0 1 0 12"></path>
    </svg>
    <svg id="iconMute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="4 9 9 9 13 5 13 19 9 15 4 15 4 9"></polygon>
      <line x1="16" y1="9" x2="22" y2="15"></line>
      <line x1="22" y1="9" x2="16" y2="15"></line>
    </svg>
  </button>

  <div class="control-wrap">
    <label for="volumeRange">Volumen</label>
    <input type="range" id="volumeRange" min="0" max="100" value="80" step="1">
  </div>

  <div class="control-wrap">
    <label for="reverbRange">Espacio</label>
    <input type="range" id="reverbRange" min="0" max="100" value="30" step="1">
  </div>

  <div class="control-wrap">
    <label for="delayRange">Eco</label>
    <input type="range" id="delayRange" min="0" max="100" value="15" step="1">
  </div>

  <div class="control-wrap">
    <label for="speedRange">Velocidad</label>
    <input type="range" id="speedRange" min="20" max="260" value="90" step="10">
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     1) CANVAS: setup, resize y utilidades de dibujo
     ============================================================ */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0; // dimensiones lógicas (CSS px), no físicas
  const GRID_SIZE = 28; // tamaño de casillero del cuaderno; también la grilla del modo pixel art

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // trabajamos siempre en coords lógicas
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  /* ============================================================
     2) MOTOR DE AUDIO (Web Audio API nativa)
     ============================================================ */
  let audioCtx = null;
  let masterGain = null;
  let reverbSend = null;
  let delaySend = null;
  let compressorNode = null; // salida final del mix; de acá se toma el audio para grabar
  let masterVolume = 0.8; // 0..1, controlado por el slider de volumen (0 = silencio)
  let reverbAmount = 0.30; // 0..1, controlado por el slider "Espacio"
  let delayAmount = 0.15;  // 0..1, controlado por el slider "Eco"
  const REVERB_SEND_MAX = 0.6; // tope del send para que no ahogue el sonido directo
  const DELAY_SEND_MAX = 0.5;

  // Genera una respuesta al impulso sintética (ruido con decaimiento
  // exponencial) para el "espacio" (reverb): no hay archivos de audio
  // externos, así que el ambiente se construye por código.
  function createImpulseResponse(ctx, duration, decay){
    const rate = ctx.sampleRate;
    const length = Math.floor(rate * duration);
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++){
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function ensureAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = masterVolume;

    // Compresor a la salida: cuando suenan muchas voces a la vez (varios
    // trazos, varios cruces simultáneos) la suma puede saturar; el
    // compresor amortigua los picos para que no se rompa el sonido.
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -20;
    compressor.knee.value = 20;
    compressor.ratio.value = 10;
    compressor.attack.value = 0.004;
    compressor.release.value = 0.2;
    masterGain.connect(compressor).connect(audioCtx.destination);
    compressorNode = compressor;

    // "Espacio" (reverb): send/return con un convolver. La cantidad de
    // mezcla la controla reverbSend, ajustable con el slider "Espacio".
    const convolver = audioCtx.createConvolver();
    convolver.buffer = createImpulseResponse(audioCtx, 2.2, 2.5);
    reverbSend = audioCtx.createGain();
    reverbSend.gain.value = reverbAmount * REVERB_SEND_MAX;
    masterGain.connect(reverbSend).connect(convolver).connect(compressor);

    // "Eco" (delay con feedback): se repite y decae solo. La cantidad de
    // mezcla la controla delaySend, ajustable con el slider "Eco".
    const delayNode = audioCtx.createDelay(1.0);
    delayNode.delayTime.value = 0.28;
    const feedbackGain = audioCtx.createGain();
    feedbackGain.gain.value = 0.35;
    delayNode.connect(feedbackGain);
    feedbackGain.connect(delayNode);
    delaySend = audioCtx.createGain();
    delaySend.gain.value = delayAmount * DELAY_SEND_MAX;
    masterGain.connect(delaySend).connect(delayNode).connect(compressor);
  }

  // Escala pentatónica mayor: cualquier combinación de notas suena bien.
  const SCALE = [0, 2, 4, 7, 9]; // semitonos relativos a la raíz
  const OCTAVES = 3;
  const BASE_FREQ = 220; // A3

  // Mapea una posición Y del canvas a una frecuencia dentro de la escala.
  // Arriba (y chico) = agudo, abajo (y grande) = grave.
  function freqForY(y){
    const steps = SCALE.length * OCTAVES;
    const t = Math.min(1, Math.max(0, y / H));
    const stepFromTop = Math.min(steps - 1, Math.floor(t * steps));
    const stepFromBottom = steps - 1 - stepFromTop;
    const octave = Math.floor(stepFromBottom / SCALE.length);
    const semitone = SCALE[stepFromBottom % SCALE.length];
    const totalSemitones = octave * 12 + semitone;
    return BASE_FREQ * Math.pow(2, totalSemitones / 12);
  }

  // Motor de "voces" continuas: en vez de disparar una nota corta por
  // cada cruce, cada CRUCE de un trazo con el playhead tiene su propia
  // voz synth (dos osciladores en unísono + filtro lowpass) que queda
  // ENCENDIDA mientras el playhead recorre ese tramo, deslizando (glide)
  // el tono para seguir la curva. Un mismo trazo puede cruzar la línea
  // varias veces a la vez (zigzag, espiral): cada cruce suena por
  // separado y de forma independiente, no solo el primero detectado.
  function createVoice(style, y){
    const now = audioCtx.currentTime;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = style.q;
    filter.frequency.setValueAtTime(style.filterStart, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    filter.connect(gain).connect(masterGain);

    const oscs = [-style.detune, style.detune].map((detune) => {
      const osc = audioCtx.createOscillator();
      osc.type = style.type;
      osc.detune.value = detune;
      osc.connect(filter);
      osc.start(now);
      return osc;
    });

    return { oscs, filter, gain, style, active: false, removed: false, lastY: y };
  }

  // Enciende una voz al detectar un cruce nuevo: ataque rápido de
  // volumen y el filtro se abre y luego se va cerrando.
  function voiceEnter(v, y){
    const now = audioCtx.currentTime;
    const freq = freqForY(y);
    v.oscs.forEach(o => o.frequency.setValueAtTime(freq, now));
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(0.0001, now);
    v.gain.gain.linearRampToValueAtTime(v.style.level, now + 0.025);
    v.filter.frequency.cancelScheduledValues(now);
    v.filter.frequency.setValueAtTime(v.style.filterStart, now);
    v.filter.frequency.exponentialRampToValueAtTime(v.style.filterEnd, now + 1.6);
    v.active = true;
    v.lastY = y;
  }

  // Mientras la voz sigue activa, desliza el tono hacia la nueva
  // posición Y en vez de saltar: eso es lo que da la sensación de lectura
  // continua de la línea dibujada.
  function voiceGlide(v, y){
    const now = audioCtx.currentTime;
    const freq = freqForY(y);
    v.oscs.forEach(o => {
      o.frequency.cancelScheduledValues(now);
      o.frequency.setTargetAtTime(freq, now, 0.045);
    });
    v.lastY = y;
  }

  // Apaga la voz con un release corto al salir de la zona del cruce.
  function voiceExit(v){
    if (!v.active) return;
    v.active = false;
    const now = audioCtx.currentTime;
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(0.0001, now + 0.12);
    const { oscs, filter, gain } = v;
    setTimeout(() => {
      oscs.forEach(o => { try { o.stop(); } catch (e) {} o.disconnect(); });
      filter.disconnect();
      gain.disconnect();
      v.removed = true;
    }, 200);
  }

  /* ============================================================
     3) PALETA DE COLORES / TIMBRES ROTATIVOS
     Cada color de trazo define también su timbre (oscilador + envolvente
     + filtro). Todos son sonidos sostenidos tipo synth, no plucks cortos.
     ============================================================ */
  const STYLES = [
    { color: '#7c3aed', type: 'sine',     attack: 0.02, hold: 0.05, release: 0.90, level: 0.18, detune: 6,  filterStart: 3000, filterEnd: 800,  q: 0.7 }, // violeta
    { color: '#f97316', type: 'square',   attack: 0.015,hold: 0.04, release: 0.50, level: 0.10, detune: 8,  filterStart: 2500, filterEnd: 600,  q: 1.0 }, // naranja
    { color: '#16a34a', type: 'triangle', attack: 0.03, hold: 0.08, release: 1.10, level: 0.16, detune: 5,  filterStart: 3500, filterEnd: 900,  q: 0.5 }, // verde
    { color: '#dc2626', type: 'sawtooth', attack: 0.01, hold: 0.03, release: 0.60, level: 0.09, detune: 10, filterStart: 2200, filterEnd: 500,  q: 1.2 }, // rojo
    { color: '#2563eb', type: 'sine',     attack: 0.05, hold: 0.10, release: 1.40, level: 0.18, detune: 4,  filterStart: 4000, filterEnd: 1000, q: 0.4 }, // azul
    { color: '#eab308', type: 'square',   attack: 0.012,hold: 0.03, release: 0.45, level: 0.08, detune: 7,  filterStart: 2000, filterEnd: 550,  q: 1.0 }, // amarillo
    { color: '#db2777', type: 'triangle', attack: 0.025,hold: 0.06, release: 0.85, level: 0.14, detune: 6,  filterStart: 3200, filterEnd: 750,  q: 0.6 }, // rosa
  ];
  let styleIndex = 0;
  function nextStyle(){
    const s = STYLES[styleIndex % STYLES.length];
    styleIndex++;
    return s;
  }

  // Si el usuario fija un color/timbre desde el selector, todos los
  // trazos nuevos lo usan; si no, se sigue rotando automáticamente.
  let styleOverride = null;
  function currentDrawStyle(){
    return styleOverride || nextStyle();
  }

  /* ============================================================
     4) ESTADO DE DIBUJO (trazos libres) y DESHACER
     ============================================================ */
  const strokes = []; // { points:[{x,y}], style, voices:[] }
  let currentStroke = null;
  let isDrawing = false;

  // Deshacer por snapshot: antes de cada acción "de un gesto" (un trazo
  // nuevo, un arrastre de goma, un borrado total) guardamos una foto de
  // los trazos tal como estaban. Deshacer simplemente restaura la última
  // foto guardada — así un solo undo revierte el gesto completo, no cada
  // punto suelto.
  const undoStack = [];
  const UNDO_LIMIT = 30;

  function snapshotStrokes(){
    return strokes.map(s => ({ points: s.points.slice(), style: s.style, pixelCell: s.pixelCell || null }));
  }

  function pushUndoSnapshot(){
    undoStack.push(snapshotStrokes());
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  }

  function undo(){
    if (undoStack.length === 0) return false;
    const snapshot = undoStack.pop();
    for (const stroke of strokes) for (const v of stroke.voices) voiceExit(v);
    strokes.length = 0;
    paintedCells.clear();
    for (const s of snapshot){
      const restored = { points: s.points.slice(), style: s.style, voices: [], pixelCell: s.pixelCell };
      strokes.push(restored);
      if (restored.pixelCell) paintedCells.set(cellKey(restored.pixelCell.col, restored.pixelCell.row), restored);
    }
    currentStroke = null;
    isDrawing = false;
    return true;
  }

  const MIN_POINT_DIST = 2.5; // px mínimos entre puntos para no saturar

  function addPoint(stroke, x, y){
    const pts = stroke.points;
    const last = pts[pts.length - 1];
    if (last){
      const dx = x - last.x, dy = y - last.y;
      if ((dx*dx + dy*dy) < MIN_POINT_DIST*MIN_POINT_DIST) return;
    }
    pts.push({ x, y });
  }

  function startStroke(x, y){
    ensureAudio();
    currentStroke = {
      points: [{ x, y }],
      style: currentDrawStyle(),
      voices: [],
    };
    strokes.push(currentStroke);
    isDrawing = true;
    hint.classList.add('hidden');
  }

  function endStroke(){
    isDrawing = false;
    currentStroke = null;
  }

  // Borra de forma PARCIAL: solo quita los puntos del trazo que caen
  // cerca de (x,y), y si eso parte el trazo en dos, cada mitad queda
  // como un trazo independiente (mismo color/timbre). No borra la línea
  // entera, solo el pedacito tocado por la goma.
  const ERASER_RADIUS = 20; // px

  function eraseAt(x, y){
    const r2 = ERASER_RADIUS * ERASER_RADIUS;
    for (let i = strokes.length - 1; i >= 0; i--){
      const stroke = strokes[i];
      const pts = stroke.points;

      let touched = false;
      const pieces = [];
      let current = [];
      for (const p of pts){
        const dx = p.x - x, dy = p.y - y;
        if (dx * dx + dy * dy <= r2){
          touched = true;
          if (current.length > 1) pieces.push(current);
          current = [];
        } else {
          current.push(p);
        }
      }
      if (current.length > 1) pieces.push(current);
      if (!touched) continue;

      strokes.splice(i, 1);
      if (stroke === currentStroke){ currentStroke = null; isDrawing = false; }

      if (pieces.length === 0){
        for (const v of stroke.voices) voiceExit(v);
        if (stroke.pixelCell) paintedCells.delete(cellKey(stroke.pixelCell.col, stroke.pixelCell.row));
        continue;
      }
      // El primer pedazo se queda con las voces activas del trazo original
      // para no cortar el sonido de golpe si la goma no tocó esa zona;
      // los pedazos nuevos arrancan sin voces (sonarán si el playhead
      // vuelve a cruzarlos).
      pieces.forEach((points, idx) => {
        strokes.splice(i, 0, {
          points,
          style: stroke.style,
          voices: idx === 0 ? stroke.voices : [],
        });
      });
    }
  }

  // Modo Pixel art: en vez de un trazo libre, cada celda pintada de la
  // grilla se guarda como un "trazo" de un solo segmento horizontal que
  // ocupa todo el ancho de la celda. Así se reutiliza tal cual el mismo
  // motor de audio/lectura continua que los trazos a mano alzada: el
  // playhead la lee igual, sonando brevemente mientras la atraviesa.
  const paintedCells = new Map(); // "col,row" -> trazo de esa celda

  function cellKey(col, row){ return col + ',' + row; }

  function paintCell(col, row){
    const key = cellKey(col, row);
    if (paintedCells.has(key)) return;
    const x0 = col * GRID_SIZE, x1 = x0 + GRID_SIZE;
    const yMid = row * GRID_SIZE + GRID_SIZE / 2;
    const stroke = {
      points: [{ x: x0 + 1, y: yMid }, { x: x1 - 1, y: yMid }],
      style: currentDrawStyle(),
      voices: [],
      pixelCell: { col, row },
    };
    strokes.push(stroke);
    paintedCells.set(key, stroke);
  }

  function removeCell(col, row){
    const key = cellKey(col, row);
    const stroke = paintedCells.get(key);
    if (!stroke) return;
    for (const v of stroke.voices) voiceExit(v);
    const idx = strokes.indexOf(stroke);
    if (idx !== -1) strokes.splice(idx, 1);
    paintedCells.delete(key);
  }

  /* ============================================================
     5) PLAYHEAD: posición, loop y lectura continua de los trazos
     ============================================================ */
  let playheadX = 0;
  let playheadSpeed = 90; // px por segundo (ajustable con el slider "Velocidad")

  function updatePlayhead(dt){
    playheadX += playheadSpeed * dt;
    if (playheadX >= W) playheadX -= W; // loop
  }

  const CROSSING_CLUSTER_DIST = 10; // px: cruces muy próximos en Y cuentan como uno solo

  // Busca TODOS los puntos donde el trazo cruza la X actual del playhead
  // (un mismo trazo puede cruzarla varias veces a la vez: zigzag, espiral,
  // letras, etc.) y devuelve sus Y interpoladas, de arriba a abajo.
  // Cruces muy cercanos entre sí se agrupan para no spamear voces por
  // el jitter normal de dibujar a mano.
  function sampleStrokeCrossings(stroke){
    const pts = stroke.points;
    const raw = [];
    for (let i = 0; i < pts.length - 1; i++){
      const p1 = pts[i], p2 = pts[i + 1];
      const xa = Math.min(p1.x, p2.x), xb = Math.max(p1.x, p2.x);
      if (playheadX < xa || playheadX > xb) continue;
      const t = (p2.x === p1.x) ? 0 : (playheadX - p1.x) / (p2.x - p1.x);
      raw.push(p1.y + (p2.y - p1.y) * t);
    }
    if (raw.length <= 1) return raw;
    raw.sort((a, b) => a - b);
    const merged = [raw[0]];
    for (let i = 1; i < raw.length; i++){
      if (raw[i] - merged[merged.length - 1] > CROSSING_CLUSTER_DIST) merged.push(raw[i]);
    }
    return merged;
  }

  // Cada frame, para cada trazo: detecta todos sus cruces actuales con
  // el playhead y empareja cada uno con la voz activa más cercana (por Y)
  // para mantener el glide continuo de ese cruce en particular. Los
  // cruces sin voz previa encienden una voz nueva; las voces que ya no
  // tienen cruce que las sostenga se apagan. Así ningún cruce simultáneo
  // queda "tapado" por otro: cada uno suena de forma independiente.
  function updateVoices(){
    if (!audioCtx) return;
    for (const stroke of strokes){
      const crossings = sampleStrokeCrossings(stroke);
      const usedCrossing = new Array(crossings.length).fill(false);

      for (const v of stroke.voices){
        if (!v.active) continue;
        let bestIdx = -1, bestDist = Infinity;
        for (let i = 0; i < crossings.length; i++){
          if (usedCrossing[i]) continue;
          const d = Math.abs(crossings[i] - v.lastY);
          if (d < bestDist){ bestDist = d; bestIdx = i; }
        }
        if (bestIdx === -1){
          voiceExit(v);
        } else {
          usedCrossing[bestIdx] = true;
          voiceGlide(v, crossings[bestIdx]);
        }
      }

      for (let i = 0; i < crossings.length; i++){
        if (usedCrossing[i]) continue;
        const v = createVoice(stroke.style, crossings[i]);
        voiceEnter(v, crossings[i]);
        stroke.voices.push(v);
      }

      if (stroke.voices.some(v => v.removed)){
        stroke.voices = stroke.voices.filter(v => !v.removed);
      }
    }
  }

  /* ============================================================
     6) LOOP DE RENDER
     ============================================================ */
  const PAPER_COLOR = '#fdfcf7';
  const GRID_COLOR = '#dbe1ea';

  // Todas las funciones de dibujo reciben el contexto 2D a usar: así el
  // mismo frame se puede pintar tanto en el canvas visible como (durante
  // una grabación) en un segundo canvas más chico, sin duplicar lógica.

  // Fondo tipo cuaderno cuadriculado, dibujado directo en el canvas (no
  // como CSS del body) para que quede incluido al grabar la sesión.
  function drawBackground(c){
    c.fillStyle = PAPER_COLOR;
    c.fillRect(0, 0, W, H);

    c.save();
    c.strokeStyle = GRID_COLOR;
    c.lineWidth = 1;
    c.beginPath();
    for (let x = 0; x <= W; x += GRID_SIZE){
      c.moveTo(x + 0.5, 0);
      c.lineTo(x + 0.5, H);
    }
    for (let y = 0; y <= H; y += GRID_SIZE){
      c.moveTo(0, y + 0.5);
      c.lineTo(W, y + 0.5);
    }
    c.stroke();
    c.restore();
  }

  function drawPlayhead(c){
    c.save();
    c.strokeStyle = 'rgba(30,30,30,0.55)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(playheadX, 0);
    c.lineTo(playheadX, H);
    c.stroke();
    c.restore();
  }

  function drawStrokes(c){
    for (const stroke of strokes){
      if (stroke.pixelCell){
        const { col, row } = stroke.pixelCell;
        c.fillStyle = stroke.style.color;
        c.fillRect(col * GRID_SIZE + 1, row * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
        continue;
      }

      const pts = stroke.points;
      if (pts.length < 2) continue;

      c.save();
      c.strokeStyle = stroke.style.color;
      c.lineWidth = 3;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
      c.stroke();
      c.restore();
    }
  }

  // Dibuja un punto negro donde el playhead está "leyendo" cada trazo
  // activo en este instante (en vez de marcas que aparecen y se apagan
  // solas, sigue en vivo la posición mientras la voz suena).
  function drawActiveDots(c){
    c.save();
    c.fillStyle = '#141414';
    for (const stroke of strokes){
      for (const v of stroke.voices){
        if (!v.active) continue;
        c.beginPath();
        c.arc(playheadX, v.lastY, 5, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  // Mientras se está grabando, se setea a un segundo canvas (más chico,
  // sin escala retina) al que también se dibuja cada frame — ver
  // sección 9. Así la grabación no tiene que codificar la resolución
  // física completa del celular, que es mucho más pesada de lo que hace
  // falta para compartir un video y puede trabar/saltear frames.
  let recordCtx = null;

  let lastTime = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - lastTime) / 1000); // clamp por si hay tab en pausa
    lastTime = now;

    updatePlayhead(dt);
    updateVoices();

    drawBackground(ctx);
    drawStrokes(ctx);
    drawActiveDots(ctx);
    drawPlayhead(ctx);

    if (recordCtx){
      drawBackground(recordCtx);
      drawStrokes(recordCtx);
      drawActiveDots(recordCtx);
      drawPlayhead(recordCtx);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============================================================
     7) INPUT: mouse + touch (Pointer Events unifica ambos)
     ============================================================ */
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  let mode = 'draw'; // 'draw' | 'pixel' | 'erase'
  let isErasing = false;
  let isPixelPainting = false;
  let lastPixelCell = null; // evita repintar la misma celda mientras se arrastra
  let toolbarOpen = false; // la toolbar arranca colapsada; se abre con el ícono flotante

  // El botón derecho del mouse actúa como goma al instante, sin tener que
  // cambiar de herramienta: mientras se mantiene apretado borra, y al
  // soltarlo se vuelve a la herramienta que estaba activa antes.
  let rightClickErasing = false;
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  canvas.addEventListener('pointerdown', (e) => {
    // Si la toolbar está abierta, el primer toque afuera solo la cierra
    // (no dibuja de paso), como un menú que se descarta al tocar afuera.
    if (toolbarOpen){
      setToolbarOpen(false);
      return;
    }

    canvas.setPointerCapture(e.pointerId);
    const { x, y } = getPos(e);

    if (e.button === 2){
      pushUndoSnapshot();
      rightClickErasing = true;
      canvas.classList.add('erasing');
      eraseAt(x, y);
      return;
    }

    if (mode === 'erase'){
      pushUndoSnapshot();
      isErasing = true;
      eraseAt(x, y);
    } else if (mode === 'pixel'){
      pushUndoSnapshot();
      ensureAudio();
      isPixelPainting = true;
      const col = Math.floor(x / GRID_SIZE), row = Math.floor(y / GRID_SIZE);
      lastPixelCell = cellKey(col, row);
      // Tocar una celda vacía la pinta; tocar una ya pintada la borra
      // (toggle), para corregir rápido sin cambiar de herramienta.
      if (paintedCells.has(lastPixelCell)) removeCell(col, row);
      else paintCell(col, row);
      hint.classList.add('hidden');
    } else {
      pushUndoSnapshot();
      startStroke(x, y);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const { x, y } = getPos(e);

    if (rightClickErasing){
      eraseAt(x, y);
      return;
    }

    if (mode === 'erase'){
      if (isErasing) eraseAt(x, y);
    } else if (mode === 'pixel'){
      if (!isPixelPainting || x < 0 || y < 0 || x >= W || y >= H) return;
      const col = Math.floor(x / GRID_SIZE), row = Math.floor(y / GRID_SIZE);
      const key = cellKey(col, row);
      if (key !== lastPixelCell){
        lastPixelCell = key;
        paintCell(col, row); // arrastrar solo pinta, no togglea (para no borrar sin querer)
      }
    } else if (isDrawing && currentStroke){
      addPoint(currentStroke, x, y);
    }
  });

  function stopInteraction(){
    isErasing = false;
    isPixelPainting = false;
    if (rightClickErasing){
      rightClickErasing = false;
      canvas.classList.toggle('erasing', mode === 'erase');
    }
    if (isDrawing) endStroke();
  }
  canvas.addEventListener('pointerup', stopInteraction);
  canvas.addEventListener('pointercancel', stopInteraction);
  canvas.addEventListener('pointerleave', stopInteraction);

  // Deshacer con Ctrl+Z / Cmd+Z (teclado, para desktop).
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      undo();
    }
  });

  // Botón "atrás" del celular como deshacer: empujamos un estado extra
  // en el historial para poder "atraparlo" con popstate. Si hay algo
  // para deshacer, deshacemos y volvemos a armar la trampa para el
  // próximo "atrás". Si no queda nada, dejamos que el "atrás" funcione
  // normal (cierra la app o vuelve a la página anterior).
  if (window.history && window.history.pushState){
    history.pushState({ musicagrama: true }, '');
    window.addEventListener('popstate', () => {
      if (undo()) history.pushState({ musicagrama: true }, '');
    });
  }

  /* ============================================================
     8) UI: herramientas (lápiz/goma), limpiar, volumen, espacio/eco,
        velocidad
     ============================================================ */
  const hint = document.getElementById('hint');
  const fabBtn = document.getElementById('fabBtn');
  const toolbarEl = document.getElementById('toolbar');
  const pencilBtn = document.getElementById('pencilBtn');
  const pixelBtn = document.getElementById('pixelBtn');
  const colorRow = document.getElementById('colorRow');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const muteBtn = document.getElementById('muteBtn');
  const iconSound = document.getElementById('iconSound');
  const iconMute = document.getElementById('iconMute');
  const volumeRange = document.getElementById('volumeRange');
  const reverbRange = document.getElementById('reverbRange');
  const delayRange = document.getElementById('delayRange');
  const speedRange = document.getElementById('speedRange');

  // El ícono flotante abre la toolbar; se cierra tocando el canvas
  // (ver el pointerdown de la sección 7) o el propio botón de nuevo.
  function setToolbarOpen(open){
    toolbarOpen = open;
    toolbarEl.classList.toggle('open', open);
    fabBtn.classList.toggle('hidden', open);
  }
  fabBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setToolbarOpen(true);
  });

  function setMode(newMode){
    mode = newMode;
    pencilBtn.classList.toggle('active', mode === 'draw');
    pixelBtn.classList.toggle('active', mode === 'pixel');
    eraserBtn.classList.toggle('active', mode === 'erase');
    canvas.classList.toggle('erasing', mode === 'erase');
  }
  pencilBtn.addEventListener('click', () => setMode('draw'));
  pixelBtn.addEventListener('click', () => setMode('pixel'));
  eraserBtn.addEventListener('click', () => setMode('erase'));

  clearBtn.addEventListener('click', () => {
    pushUndoSnapshot();
    for (const stroke of strokes) for (const v of stroke.voices) voiceExit(v);
    strokes.length = 0;
    paintedCells.clear();
    currentStroke = null;
    isDrawing = false;
  });

  function updateSoundIcon(){
    const muted = masterVolume <= 0;
    iconSound.style.display = muted ? 'none' : '';
    iconMute.style.display = muted ? '' : 'none';
  }

  // El botón silencia/reactiva de un toque, recordando el volumen previo
  // para restaurarlo; el slider de al lado queda siempre visible para
  // ajustes finos rápidos.
  let volumeBeforeMute = masterVolume;
  muteBtn.addEventListener('click', () => {
    if (masterVolume > 0){
      volumeBeforeMute = masterVolume;
      masterVolume = 0;
    } else {
      masterVolume = volumeBeforeMute || 0.8;
    }
    volumeRange.value = Math.round(masterVolume * 100);
    if (masterGain) masterGain.gain.value = masterVolume;
    updateSoundIcon();
  });

  // Selector de color/timbre: todas las opciones siempre a la vista en
  // la toolbar (nada de popover ni ciclar) — un toque elige directo. La
  // primera opción es "automático" (arcoíris: rota de color solo), que
  // es la que está activa por defecto.
  const AUTO_GRADIENT = 'conic-gradient(from 0deg,#7c3aed,#f97316,#16a34a,#dc2626,#2563eb,#eab308,#db2777,#7c3aed)';

  function selectDrawStyle(style, btnEl){
    styleOverride = style;
    colorRow.querySelectorAll('.swatch').forEach((el) => el.classList.toggle('selected', el === btnEl));
  }

  (function buildColorSwatches(){
    const autoBtn = document.createElement('button');
    autoBtn.type = 'button';
    autoBtn.className = 'swatch selected';
    autoBtn.style.background = AUTO_GRADIENT;
    autoBtn.title = 'Automático: cada trazo rota de color y timbre';
    autoBtn.addEventListener('click', () => selectDrawStyle(null, autoBtn));
    colorRow.appendChild(autoBtn);

    STYLES.forEach((style) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch';
      btn.style.background = style.color;
      btn.title = `Dibujar siempre con este color/timbre (${style.type})`;
      btn.addEventListener('click', () => selectDrawStyle(style, btn));
      colorRow.appendChild(btn);
    });
  })();

  volumeRange.addEventListener('input', () => {
    masterVolume = Number(volumeRange.value) / 100;
    if (masterGain) masterGain.gain.value = masterVolume;
    updateSoundIcon();
  });

  reverbRange.addEventListener('input', () => {
    reverbAmount = Number(reverbRange.value) / 100;
    if (reverbSend) reverbSend.gain.value = reverbAmount * REVERB_SEND_MAX;
  });

  delayRange.addEventListener('input', () => {
    delayAmount = Number(delayRange.value) / 100;
    if (delaySend) delaySend.gain.value = delayAmount * DELAY_SEND_MAX;
  });

  speedRange.addEventListener('input', () => {
    playheadSpeed = Number(speedRange.value);
  });
  playheadSpeed = Number(speedRange.value);

  /* ============================================================
     9) GRABAR SESIÓN: captura el canvas + el audio final con
     MediaRecorder nativo, y ofrece compartirlo (o descargarlo).
     ============================================================ */
  const recordBtn = document.getElementById('recordBtn');
  const recIndicator = document.getElementById('recIndicator');
  const recTimeLabel = document.getElementById('recTime');
  const recResult = document.getElementById('recResult');
  const recResultText = document.getElementById('recResultText');
  const shareRecBtn = document.getElementById('shareRecBtn');
  const downloadRecBtn = document.getElementById('downloadRecBtn');
  const dismissRecBtn = document.getElementById('dismissRecBtn');

  const RECORD_MAX_MS = 3 * 60 * 1000; // tope de 3 min para no comerse la memoria del celular
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordCanvas = null;
  let recordDestNode = null;
  let recordVideoStream = null;
  let recordStartedAt = 0;
  let recordTickHandle = null;
  let recordAutoStopHandle = null;
  let pendingRecordingFile = null; // listo para compartir/descargar

  function pickRecordMimeType(){
    const candidates = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
      'video/mp4',
    ];
    for (const type of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
    }
    return '';
  }

  function updateRecTime(){
    const secs = Math.floor((performance.now() - recordStartedAt) / 1000);
    const mm = String(Math.floor(secs / 60)).padStart(2, '0');
    const ss = String(secs % 60).padStart(2, '0');
    recTimeLabel.textContent = `${mm}:${ss}`;
  }

  function startRecording(){
    if (!window.MediaRecorder || !canvas.captureStream){
      hint.textContent = 'Este navegador no puede grabar video 😕';
      hint.classList.remove('hidden');
      return;
    }
    ensureAudio();

    const mimeType = pickRecordMimeType();

    // Grabamos desde un canvas aparte, a resolución "CSS" (sin el
    // multiplicador de pantalla retina): el mismo dibujo, con muchos
    // menos píxeles por frame, para que el codificador en tiempo real
    // no se atore y la grabación salga fluida en vez de entrecortada.
    recordCanvas = document.createElement('canvas');
    recordCanvas.width = W;
    recordCanvas.height = H;
    recordCtx = recordCanvas.getContext('2d');

    recordVideoStream = recordCanvas.captureStream(30);
    recordDestNode = audioCtx.createMediaStreamDestination();
    compressorNode.connect(recordDestNode); // se suma a la salida normal, no la reemplaza

    const stream = new MediaStream([
      ...recordVideoStream.getVideoTracks(),
      ...recordDestNode.stream.getAudioTracks(),
    ]);

    recordedChunks = [];
    // Bitrate limitado: el dibujo es mayormente líneas simples sobre
    // fondo claro (se comprime muy bien) y un archivo más chico entra
    // más fácil dentro de los límites de tamaño para compartir/WhatsApp.
    const recorderOptions = { videoBitsPerSecond: 1_500_000, audioBitsPerSecond: 128_000 };
    if (mimeType) recorderOptions.mimeType = mimeType;
    mediaRecorder = new MediaRecorder(stream, recorderOptions);
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => finishRecording(mediaRecorder.mimeType || mimeType || 'video/webm');
    mediaRecorder.start();

    recordStartedAt = performance.now();
    recordBtn.classList.add('recording');
    recIndicator.hidden = false;
    updateRecTime();
    recordTickHandle = setInterval(updateRecTime, 500);
    recordAutoStopHandle = setTimeout(stopRecording, RECORD_MAX_MS);
  }

  function stopRecording(){
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.stop();
    clearInterval(recordTickHandle);
    clearTimeout(recordAutoStopHandle);
    recordBtn.classList.remove('recording');
    recIndicator.hidden = true;
    recordCtx = null; // deja de pintar el segundo canvas
  }

  // Al terminar de procesar, NO se llama a navigator.share() acá: para
  // Android, share() necesita un gesto de usuario "fresco" (un tap hecho
  // a propósito), y este callback llega de forma asíncrona después de
  // ese tap original — por eso mostramos un botón "Compartir" y recién
  // ahí, dentro de ESE click, se dispara el share.
  function finishRecording(rawMimeType){
    // Deja de sumar la salida de audio a la grabación y libera la cámara
    // virtual del canvas; la reproducción normal sigue sin cambios.
    compressorNode.disconnect(recordDestNode);
    recordVideoStream.getTracks().forEach((t) => t.stop());

    // Usamos el tipo MIME "limpio" (sin ";codecs=...") para el Blob/File:
    // Android valida el tipo de archivo al compartir, y la parte de
    // códecs suele hacer que rechace el archivo con "Permission denied"
    // aunque el contenido sea perfectamente válido.
    const cleanType = rawMimeType.split(';')[0].trim();
    const blob = new Blob(recordedChunks, { type: cleanType });
    recordedChunks = [];
    const ext = cleanType.includes('mp4') ? 'mp4' : 'webm';
    pendingRecordingFile = new File([blob], `musigrama.${ext}`, { type: cleanType });

    // Chequeamos de verdad si este archivo se puede compartir (no solo si
    // existe navigator.share): así avisamos de entrada si no se va a poder
    // en vez de que el botón "Compartir" no haga nada al tocarlo.
    const shareable = !!navigator.share &&
      (!navigator.canShare || navigator.canShare({ files: [pendingRecordingFile] }));
    shareRecBtn.hidden = !shareable;
    const sizeMB = (pendingRecordingFile.size / (1024 * 1024)).toFixed(1);
    recResultText.textContent = shareable
      ? `Grabación lista (${sizeMB} MB)`
      : `Grabación lista (${sizeMB} MB) — este navegador no puede compartirla directo, descargala y compartila desde tus archivos`;
    recResult.hidden = false;
  }

  function hideRecResult(){
    recResult.hidden = true;
    pendingRecordingFile = null;
  }

  shareRecBtn.addEventListener('click', async () => {
    if (!pendingRecordingFile) return;
    try {
      await navigator.share({
        files: [pendingRecordingFile],
        title: 'Musigrama',
        text: 'Mi sesión de Musigrama',
      });
      hideRecResult();
    } catch (err) {
      if (err && err.name === 'AbortError') return; // el usuario canceló el share, no es un error
      recResultText.textContent = 'No se pudo compartir directo: ' +
        (err && err.message ? err.message : 'error desconocido') + '. Probá "Descargar".';
    }
  });

  downloadRecBtn.addEventListener('click', () => {
    if (!pendingRecordingFile) return;
    const url = URL.createObjectURL(pendingRecordingFile);
    const a = document.createElement('a');
    a.href = url;
    a.download = pendingRecordingFile.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    hideRecResult();
  });

  dismissRecBtn.addEventListener('click', hideRecResult);

  recordBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    else {
      hideRecResult();
      startRecording();
    }
  });

})();
</script>

<script>
  // Registra el service worker para que la app quede instalable y
  // funcione offline una vez abierta la primera vez.
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
